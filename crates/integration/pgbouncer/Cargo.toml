[package]
name = "pgbouncer_compat"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "pgbouncer_compat"
path = "src/lib.rs"

[[bin]]
name = "pgrust-pgbouncer"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }

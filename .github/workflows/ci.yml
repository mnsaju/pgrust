name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger: the regression tiers are expensive and occasionally need
  # a re-run against an unchanged tree (flaky Docker pulls, ledger triage).
  workflow_dispatch:

# Cancel superseded runs on the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: build / test / fmt (clippy informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # rust-toolchain.toml pins 1.96.0; rustup (preinstalled on the runner)
      # picks it up automatically on the first cargo/rustc invocation below.
      # locales: pg_locale's libc-collation tests build a real en_US.UTF-8
      # collator and fail if the OS has no locale data for it.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libre2-dev locales
          echo 'en_US.UTF-8 UTF-8' | sudo tee -a /etc/locale.gen
          sudo locale-gen

      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo build --workspace
        run: cargo build --workspace --all-targets

      - name: cargo test --workspace
        run: cargo test --workspace --no-fail-fast

      # Informational only: the workspace isn't clippy-clean yet, and a
      # mechanical sweep to make it so is a separate, deliberately unmerged
      # effort (much of it touches unsafe/raw-pointer code, which is exactly
      # the kind of change you don't want to force through in one big pass).
      # continue-on-error keeps this step's outcome from failing the job
      # while still surfacing new warnings introduced on this PR.
      - name: cargo clippy --workspace (informational)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

  regress:
    name: PostgreSQL regression/isolation suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build pgrust image
        run: docker build -t pgrust:regress .

      - name: Run regression + isolation suites
        run: regress/run-regress-docker.sh

      # run-regress-docker.sh deliberately exits 0 on "some tests failed"
      # (status 1) and only fails on "could not run at all" (status 2), so it
      # cannot gate on its own. The gate is the comparator: pg_regress's raw
      # diff counts the overlay's own `-- pgrust:rowsort` marker echo as a
      # failure (136 of 157 on the 2026-09-04 seed run), which this strips
      # before judging. --allow-file ratchets against the known-failure
      # ledger: a new failure fails the build, and so does a ledger entry
      # that has started passing.
      - name: Gate regression results (rowsort comparator + ratchet)
        run: |
          python3 scripts/rowsort_compare.py \
            --sql-dir regress/overlay/sql \
            --actual-dir regress-work/regress-output/results \
            --expected-dir regress-work/regress/expected \
            --allow-file regress/known-failures.allow \
            --json regress-work/rowsort-report.json

      # PL/pgSQL tier: upstream's 13 supplementary plpgsql suites, which are
      # NOT part of src/test/regress -- the core schedule runs one large
      # `plpgsql` test, while procedure/transaction control, record and
      # composite datums, domains over composites and CONSTANT/NOT NULL
      # variable properties live only here. Unlike the two runners above, this
      # one keeps the pg_regress driver in its own container and drives the
      # pgrust server over a docker network, so a driver fault cannot be
      # mistaken for a server fault. Gated by its own ratchet ledger.
      - name: Run plpgsql supplementary suites (gated)
        run: |
          regress/run-plpgsql-regress-docker.sh \
            --allow-file regress/plpgsql-known-failures.allow

      # Extensions tier: upstream's per-contrib suites, same pg_regress
      # --use-existing mechanism as the core suite. Gated by its own ratchet
      # ledger. Modules pgrust does not port are classified SKIP by the runner
      # (no extension ABI exists to load them), never counted as failures.
      - name: Run contrib regression suites (gated)
        run: |
          regress/run-contrib-regress-docker.sh \
            --allow-file regress/contrib-known-failures.allow

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regress-results
          path: |
            regress-work/rowsort-report.json
            regress-work/regress-output/regression.diffs
            regress-work/contrib/*.log
            regress-work/plpgsql/plpgsql.log
            regress-work/plpgsql/output/regression.diffs
          if-no-files-found: ignore
